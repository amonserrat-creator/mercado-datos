name: historico-mensual
on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 1 * *'
permissions:
  contents: write
concurrency:
  group: historico
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python historico.py && python hist_series.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/hist_mensual.json data/hist_series.json
          git commit -m "histórico mensual $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
